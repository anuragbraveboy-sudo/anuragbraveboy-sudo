<svg width="100%" height="250" viewBox="0 0 800 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 800; font-size: 50px; fill: #ffffff; animation: fadeInDown 1s ease-out forwards; opacity: 0; }
    .subtitle { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 600; font-size: 26px; fill: #00f2fe; animation: fadeInUp 1s ease-out 0.5s forwards; opacity: 0; }
    .special { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 700; font-size: 20px; fill: #9fa8da; text-anchor: middle; letter-spacing: 4px; animation: fadeIn 1.5s ease-out 1.2s forwards; opacity: 0; }
    
    @keyframes fadeInDown {
      0% { opacity: 0; transform: translateY(-30px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeInUp {
      0% { opacity: 0; transform: translateY(30px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
    
    /* Animated Wall Objects */
    .bg-shape { animation: float 8s infinite ease-in-out alternate; }
    .bg-shape-reverse { animation: float-reverse 10s infinite ease-in-out alternate; }
    .bg-shape-slow { animation: float 15s infinite ease-in-out alternate; }
    .bg-shape-spin { animation: spin 20s linear infinite; transform-origin: center; transform-box: fill-box; }
    
    @keyframes float {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-40px) rotate(15deg); }
      100% { transform: translateY(20px) rotate(-10deg); }
    }
    @keyframes float-reverse {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(40px) rotate(-15deg); }
      100% { transform: translateY(-20px) rotate(10deg); }
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    /* Grid background */
    .grid { stroke: rgba(159, 168, 218, 0.1); stroke-width: 1; stroke-dasharray: 4 4; }
  </style>

  <!-- Background Base -->
  <rect width="800" height="250" fill="#05070f" rx="15" />
  
  <!-- Subtle Grid Wall -->
  <g class="grid">
    <path d="M0,50 L800,50 M0,100 L800,100 M0,150 L800,150 M0,200 L800,200" />
    <path d="M100,0 L100,250 M200,0 L200,250 M300,0 L300,250 M400,0 L400,250 M500,0 L500,250 M600,0 L600,250 M700,0 L700,250" />
  </g>
  
  <g clip-path="url(#clip)">
    <!-- Animated Glowing Orbs for the "wall" effect -->
    <circle class="bg-shape" cx="100" cy="50" r="120" fill="url(#grad1)" opacity="0.7"/>
    <circle class="bg-shape-reverse" cx="700" cy="200" r="150" fill="url(#grad2)" opacity="0.6"/>
    <circle class="bg-shape-slow" cx="400" cy="125" r="200" fill="url(#grad3)" opacity="0.4"/>
    
    <!-- Geometric Animated Shapes -->
    <g class="bg-shape-spin" style="transform-origin: 680px 60px;">
        <rect x="650" y="30" width="60" height="60" rx="10" fill="none" stroke="#00f2fe" stroke-width="2" stroke-dasharray="4,4"/>
    </g>
    <g class="bg-shape-reverse">
        <polygon points="150,180 180,230 120,230" fill="none" stroke="#b388ff" stroke-width="2" />
    </g>
    <g class="bg-shape">
        <circle cx="500" cy="40" r="20" fill="none" stroke="#9fa8da" stroke-width="2" stroke-dasharray="2,2"/>
    </g>
  </g>

  <!-- Gradients -->
  <defs>
    <clipPath id="clip">
      <rect width="800" height="250" rx="15" />
    </clipPath>
    <radialGradient id="grad1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#05070f" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="grad2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4facfe" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#05070f" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="grad3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b388ff" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#05070f" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Animated Text -->
  <text x="60" y="100" class="title">Hi, I'm Krish</text>
  <text x="60" y="145" class="subtitle">React &amp; JavaScript Developer</text>
  <text x="400" y="215" class="special">OPEN SOURCE CONTRIBUTOR &amp; IT STUDENT</text>
</svg>
