<svg width="100%" height="250" viewBox="0 0 800 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes blink {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }
    @keyframes type-script {
      0%, 10% { opacity: 0; }
      11%, 100% { opacity: 1; }
    }
    @keyframes type-connect {
      0%, 30% { opacity: 0; }
      31%, 100% { opacity: 1; }
    }
    @keyframes type-ssh {
      0%, 55% { opacity: 0; }
      56%, 100% { opacity: 1; }
    }
    @keyframes type-load {
      0%, 75% { opacity: 0; }
      76%, 100% { opacity: 1; }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.3; }
      50% { transform: scale(1.15); opacity: 0.8; }
    }
    @keyframes rotate-radar {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .cursor {
      animation: blink 0.8s infinite;
    }
    .line-1 { animation: type-script 4s step-end infinite; }
    .line-2 { animation: type-connect 4s step-end infinite; }
    .line-3 { animation: type-ssh 4s step-end infinite; }
    .line-4 { animation: type-load 4s step-end infinite; }
    .pulse-node {
      animation: pulse 3s ease-in-out infinite;
      transform-origin: center;
    }
    .radar {
      animation: rotate-radar 15s linear infinite;
      transform-origin: 650px 125px;
    }
  </style>

  <!-- Background -->
  <rect width="800" height="250" rx="10" fill="#060913"/>
  <path d="M0 0 H800 V250 H0 Z" fill="url(#bg-gradient)"/>
  
  <!-- Subtle Grid -->
  <path d="M 0,25 L 800,25 M 0,50 L 800,50 M 0,75 L 800,75 M 0,100 L 800,100 M 0,125 L 800,125 M 0,150 L 800,150 M 0,175 L 800,175 M 0,200 L 800,200 M 0,225 L 800,225" stroke="#10172a" stroke-width="0.5"/>
  <path d="M 50,0 L 50,250 M 100,0 L 100,250 M 150,0 L 150,250 M 200,0 L 200,250 M 250,0 L 250,250 M 300,0 L 300,250 M 350,0 L 350,250 M 400,0 L 400,250 M 450,0 L 450,250 M 500,0 L 500,250 M 550,0 L 550,250 M 600,0 L 600,250 M 650,0 L 650,250 M 700,0 L 700,250 M 750,0 L 750,250" stroke="#10172a" stroke-width="0.5"/>

  <!-- Glowing background elements -->
  <circle cx="650" cy="125" r="80" fill="#00f2fe" opacity="0.03" filter="url(#glow-filter)"/>
  <circle cx="150" cy="125" r="100" fill="#7f00ff" opacity="0.02" filter="url(#glow-filter)"/>

  <!-- Left: Tech Terminal Box -->
  <rect x="30" y="30" width="400" height="190" rx="6" fill="#0b0f19" stroke="#1e293b" stroke-width="1.5"/>
  <!-- Window Header -->
  <path d="M 30,50 L 430,50" stroke="#1e293b" stroke-width="1"/>
  <circle cx="45" cy="40" r="4" fill="#ef4444"/>
  <circle cx="57" cy="40" r="4" fill="#eab308"/>
  <circle cx="69" cy="40" r="4" fill="#22c55e"/>
  <text x="230" y="43" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle">terminal - guest@anurag.dev</text>

  <!-- Terminal Text -->
  <g font-family="monospace" font-size="12" fill="#00f2fe" xml:space="preserve">
    <!-- Line 1 -->
    <g class="line-1">
      <text x="50" y="80" fill="#38bdf8">guest@anurag:~$ ./connect_profile.sh</text>
    </g>
    <!-- Line 2 -->
    <g class="line-2">
      <text x="50" y="105" fill="#a855f7">Connecting to core data node...</text>
    </g>
    <!-- Line 3 -->
    <g class="line-3">
      <text x="50" y="130" fill="#4ade80">>> Handshake status: SECURE [200 OK]</text>
    </g>
    <!-- Line 4 -->
    <g class="line-4">
      <text x="50" y="155" fill="#f472b6">>> Booting system metrics...</text>
    </g>
    <!-- Line 5 -->
    <g>
      <text x="50" y="180" fill="#38bdf8">guest@anurag:~$ </text>
      <rect x="155" y="168" width="8" height="13" fill="#38bdf8" class="cursor"/>
    </g>
  </g>

  <!-- Right: Radar/Data Scanner -->
  <g class="radar">
    <circle cx="650" cy="125" r="70" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>
    <circle cx="650" cy="125" r="50" stroke="#1e293b" stroke-width="1"/>
    <circle cx="650" cy="125" r="30" stroke="#1e293b" stroke-width="1"/>
    <!-- Radar Line -->
    <line x1="650" y1="125" x2="650" y2="55" stroke="#00f2fe" stroke-width="1.5" opacity="0.8"/>
    <!-- Radial sweep gradient shading -->
    <path d="M 650 55 A 70 70 0 0 1 720 125 L 650 125 Z" fill="url(#radar-sweep)" opacity="0.15"/>
  </g>

  <!-- Tech Nodes (pulsing dots) -->
  <g>
    <circle cx="650" cy="125" r="3" fill="#00f2fe" class="pulse-node" style="animation-delay: 0s;"/>
    <circle cx="680" cy="90" r="2.5" fill="#a855f7" class="pulse-node" style="animation-delay: 0.5s;"/>
    <circle cx="600" cy="110" r="2" fill="#00f2fe" class="pulse-node" style="animation-delay: 1s;"/>
    <circle cx="620" cy="160" r="3.5" fill="#4ade80" class="pulse-node" style="animation-delay: 1.5s;"/>
    <circle cx="690" cy="150" r="2" fill="#f472b6" class="pulse-node" style="animation-delay: 2s;"/>
    <line x1="650" y1="125" x2="680" y2="90" stroke="#1e293b" stroke-width="1" opacity="0.3"/>
    <line x1="650" y1="125" x2="600" y2="110" stroke="#1e293b" stroke-width="1" opacity="0.3"/>
    <line x1="650" y1="125" x2="620" y2="160" stroke="#1e293b" stroke-width="1" opacity="0.3"/>
    <line x1="680" y1="90" x2="690" y2="150" stroke="#1e293b" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Definitions -->
  <defs>
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="800" y2="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#02040a" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#060913" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#030712" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="radar-sweep" x1="650" y1="125" x2="720" y2="125" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
    </filter>
  </defs>
</svg>
